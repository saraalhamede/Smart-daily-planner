<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2200" viewBox="0 0 1600 2200" role="img" aria-labelledby="title desc">
  <title id="title">Smart Day Planner Visual Poster</title>
  <desc id="desc">A visual academic poster describing the Smart Day Planner system architecture and dynamic feedback loop.</desc>
  <defs>
    <linearGradient id="top" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#5468d4"/>
      <stop offset="100%" stop-color="#8057b7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#172033" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#5468d4"/>
    </marker>
  </defs>
  <rect width="1600" height="2200" fill="#edf3f8"/>
  <rect x="70" y="60" width="1460" height="2080" rx="28" fill="#f7f9ff" filter="url(#shadow)"/>
  <rect x="70" y="60" width="1460" height="260" rx="28" fill="url(#top)"/>
  <text x="130" y="150" fill="#ffffff" font-family="Segoe UI, Arial" font-size="34" font-weight="800">B.Sc Final Project</text>
  <text x="130" y="235" fill="#ffffff" font-family="Segoe UI, Arial" font-size="88" font-weight="900">Smart Day Planner</text>
  <text x="130" y="292" fill="#e9edff" font-family="Segoe UI, Arial" font-size="34">Dynamic planning by mood, energy, deadlines, fixed tasks, and feedback</text>
  <text x="1160" y="165" fill="#ffffff" font-family="Segoe UI, Arial" font-size="32" font-weight="800">Sara Alhamede</text>
  <text x="1160" y="210" fill="#ffffff" font-family="Segoe UI, Arial" font-size="32" font-weight="800">Amina Fraheen</text>
  <text x="1160" y="260" fill="#e9edff" font-family="Segoe UI, Arial" font-size="24">React + Express + MySQL</text>

  <g transform="translate(130 390)">
    <rect width="420" height="300" rx="18" fill="#ffffff" stroke="#d9e1ef"/>
    <text x="34" y="58" fill="#5468d4" font-family="Segoe UI, Arial" font-size="38" font-weight="900">Problem</text>
    <text x="34" y="112" fill="#5f6f87" font-family="Segoe UI, Arial" font-size="27">Static planners ignore real</text>
    <text x="34" y="150" fill="#5f6f87" font-family="Segoe UI, Arial" font-size="27">student state: low energy,</text>
    <text x="34" y="188" fill="#5f6f87" font-family="Segoe UI, Arial" font-size="27">stress, sleep, and workload.</text>
    <circle cx="60" cy="245" r="16" fill="#b94a62"/>
    <text x="90" y="255" fill="#172033" font-family="Segoe UI, Arial" font-size="25" font-weight="700">Procrastination risk</text>
  </g>

  <g transform="translate(590 390)">
    <rect width="420" height="300" rx="18" fill="#ffffff" stroke="#d9e1ef"/>
    <text x="34" y="58" fill="#5468d4" font-family="Segoe UI, Arial" font-size="38" font-weight="900">Solution</text>
    <text x="34" y="112" fill="#5f6f87" font-family="Segoe UI, Arial" font-size="27">A smart scheduler combines</text>
    <text x="34" y="150" fill="#5f6f87" font-family="Segoe UI, Arial" font-size="27">user input, task data, fixed</text>
    <text x="34" y="188" fill="#5f6f87" font-family="Segoe UI, Arial" font-size="27">time, and feedback.</text>
    <circle cx="60" cy="245" r="16" fill="#168a8a"/>
    <text x="90" y="255" fill="#172033" font-family="Segoe UI, Arial" font-size="25" font-weight="700">Adaptive daily plan</text>
  </g>

  <g transform="translate(1050 390)">
    <rect width="420" height="300" rx="18" fill="#ffffff" stroke="#d9e1ef"/>
    <text x="34" y="58" fill="#5468d4" font-family="Segoe UI, Arial" font-size="38" font-weight="900">Main Idea</text>
    <text x="34" y="112" fill="#5f6f87" font-family="Segoe UI, Arial" font-size="27">User input is the main source.</text>
    <text x="34" y="150" fill="#5f6f87" font-family="Segoe UI, Arial" font-size="27">Datasets and history improve</text>
    <text x="34" y="188" fill="#5f6f87" font-family="Segoe UI, Arial" font-size="27">recommendations over time.</text>
    <circle cx="60" cy="245" r="16" fill="#d9922f"/>
    <text x="90" y="255" fill="#172033" font-family="Segoe UI, Arial" font-size="25" font-weight="700">Personalization loop</text>
  </g>

  <g transform="translate(130 780)">
    <text x="0" y="0" fill="#172033" font-family="Segoe UI, Arial" font-size="44" font-weight="900">System Flow</text>
    <g transform="translate(0 48)">
      <rect width="250" height="150" rx="16" fill="#eaf7f5" stroke="#168a8a"/>
      <text x="32" y="58" fill="#172033" font-family="Segoe UI, Arial" font-size="30" font-weight="900">User Input</text>
      <text x="32" y="100" fill="#5f6f87" font-family="Segoe UI, Arial" font-size="20">Mood, energy, tasks</text>
    </g>
    <path d="M270 123 L350 123" stroke="#5468d4" stroke-width="8" marker-end="url(#arrow)"/>
    <g transform="translate(370 48)">
      <rect width="250" height="150" rx="16" fill="#f4f6ff" stroke="#5468d4"/>
      <text x="32" y="58" fill="#172033" font-family="Segoe UI, Arial" font-size="30" font-weight="900">AI Analysis</text>
      <text x="32" y="100" fill="#5f6f87" font-family="Segoe UI, Arial" font-size="20">Emotion, category</text>
    </g>
    <path d="M640 123 L720 123" stroke="#5468d4" stroke-width="8"/>
    <g transform="translate(740 48)">
      <rect width="250" height="150" rx="16" fill="#fff8ed" stroke="#d9922f"/>
      <text x="32" y="58" fill="#172033" font-family="Segoe UI, Arial" font-size="30" font-weight="900">Scheduler</text>
      <text x="32" y="100" fill="#5f6f87" font-family="Segoe UI, Arial" font-size="20">Fixed first, gaps next</text>
    </g>
    <path d="M1010 123 L1090 123" stroke="#5468d4" stroke-width="8"/>
    <g transform="translate(1110 48)">
      <rect width="250" height="150" rx="16" fill="#fff3f6" stroke="#b94a62"/>
      <text x="32" y="58" fill="#172033" font-family="Segoe UI, Arial" font-size="30" font-weight="900">Feedback</text>
      <text x="32" y="100" fill="#5f6f87" font-family="Segoe UI, Arial" font-size="20">Reschedule remaining day</text>
    </g>
  </g>

  <g transform="translate(130 1080)">
    <text x="0" y="0" fill="#172033" font-family="Segoe UI, Arial" font-size="44" font-weight="900">Architecture</text>
    <g transform="translate(0 45)">
      <rect width="1340" height="95" rx="14" fill="#ffffff" stroke="#d9e1ef"/>
      <rect width="250" height="95" rx="14" fill="#eaf7f5"/>
      <text x="28" y="58" fill="#168a8a" font-family="Segoe UI, Arial" font-size="28" font-weight="900">Presentation</text>
      <text x="290" y="58" fill="#5f6f87" font-family="Segoe UI, Arial" font-size="28">React frontend: check-in, tasks, schedule, feedback</text>
    </g>
    <g transform="translate(0 160)">
      <rect width="1340" height="95" rx="14" fill="#ffffff" stroke="#d9e1ef"/>
      <rect width="250" height="95" rx="14" fill="#f4f6ff"/>
      <text x="28" y="58" fill="#5468d4" font-family="Segoe UI, Arial" font-size="28" font-weight="900">Application</text>
      <text x="290" y="58" fill="#5f6f87" font-family="Segoe UI, Arial" font-size="28">Express API: routes, services, validation</text>
    </g>
    <g transform="translate(0 275)">
      <rect width="1340" height="95" rx="14" fill="#ffffff" stroke="#d9e1ef"/>
      <rect width="250" height="95" rx="14" fill="#fff8ed"/>
      <text x="28" y="58" fill="#d9922f" font-family="Segoe UI, Arial" font-size="28" font-weight="900">Processing</text>
      <text x="290" y="58" fill="#5f6f87" font-family="Segoe UI, Arial" font-size="28">Mood analyzer, task categorizer, scheduler, feedback learning</text>
    </g>
    <g transform="translate(0 390)">
      <rect width="1340" height="95" rx="14" fill="#ffffff" stroke="#d9e1ef"/>
      <rect width="250" height="95" rx="14" fill="#fff3f6"/>
      <text x="28" y="58" fill="#b94a62" font-family="Segoe UI, Arial" font-size="28" font-weight="900">Data Layer</text>
      <text x="290" y="58" fill="#5f6f87" font-family="Segoe UI, Arial" font-size="28">MySQL: users, tasks, schedules, feedback, survey responses</text>
    </g>
  </g>

  <g transform="translate(130 1650)">
    <rect width="640" height="330" rx="18" fill="#ffffff" stroke="#d9e1ef"/>
    <text x="34" y="62" fill="#5468d4" font-family="Segoe UI, Arial" font-size="38" font-weight="900">AI Roles</text>
    <text x="34" y="118" fill="#5f6f87" font-family="Segoe UI, Arial" font-size="26">Mood &amp; Energy Analyzer</text>
    <text x="34" y="160" fill="#5f6f87" font-family="Segoe UI, Arial" font-size="26">Task Categorizer</text>
    <text x="34" y="202" fill="#5f6f87" font-family="Segoe UI, Arial" font-size="26">Time Estimator</text>
    <text x="34" y="244" fill="#5f6f87" font-family="Segoe UI, Arial" font-size="26">Feedback Learning</text>
    <text x="34" y="286" fill="#5f6f87" font-family="Segoe UI, Arial" font-size="26">Future Python ML Service</text>
  </g>

  <g transform="translate(830 1650)">
    <rect width="640" height="330" rx="18" fill="#ffffff" stroke="#d9e1ef"/>
    <text x="34" y="62" fill="#5468d4" font-family="Segoe UI, Arial" font-size="38" font-weight="900">Future Work</text>
    <text x="34" y="118" fill="#5f6f87" font-family="Segoe UI, Arial" font-size="26">Arabic/Hebrew translation support</text>
    <text x="34" y="160" fill="#5f6f87" font-family="Segoe UI, Arial" font-size="26">Real emotion and task ML models</text>
    <text x="34" y="202" fill="#5f6f87" font-family="Segoe UI, Arial" font-size="26">Multi-user personalization</text>
    <text x="34" y="244" fill="#5f6f87" font-family="Segoe UI, Arial" font-size="26">Contrastive learning for similar users</text>
  </g>

  <text x="800" y="2075" text-anchor="middle" fill="#5f6f87" font-family="Segoe UI, Arial" font-size="25">Input -> Analysis -> Schedule -> Feedback -> Better Personalization</text>
</svg>
